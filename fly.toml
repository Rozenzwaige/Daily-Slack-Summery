# fly.toml — איתמר Slack bot
app = 'standing-togther'
primary_region = 'fra'

[build]

# Health-check HTTP server keeps the machine alive (bot itself uses Socket Mode)
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

[[restart]]
  policy = 'always'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
