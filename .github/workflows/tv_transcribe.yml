name: Nightly TV News Transcription

on:
  # Triggered externally by cron-job.org at 01:00 UTC (04:00 IDT) every Sun–Thu.
  # Runs after Channel 13 uploads the previous evening's 20:00 edition (~23:xx UTC).
  workflow_dispatch:

jobs:
  transcribe-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: news_summary/requirements.txt

      - name: Install dependencies
        run: pip install -r news_summary/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Transcribe TV bulletin and write to sheet
        env:
          GROQ_API_KEY:            ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY:       ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          RADIO_SHEET_ID:          ${{ secrets.RADIO_SHEET_ID }}
        run: python news_summary/tv_to_sheet.py
