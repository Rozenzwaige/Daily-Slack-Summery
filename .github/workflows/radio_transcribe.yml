name: Hourly Radio Transcription

on:
  # Triggered externally by cron-job.org every hour at :20 UTC.
  # The script (radio_to_sheet.py) checks internally whether the current
  # IDT hour is a target hour and exits immediately if not.
  workflow_dispatch:

jobs:
  transcribe-radio:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: news_summary/requirements.txt

      - name: Install dependencies
        run: pip install -r news_summary/requirements.txt

      - name: Transcribe bulletin and write to sheet
        env:
          GROQ_API_KEY:            ${{ secrets.GROQ_API_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          RADIO_SHEET_ID:          ${{ secrets.RADIO_SHEET_ID }}
        run: python news_summary/radio_to_sheet.py
