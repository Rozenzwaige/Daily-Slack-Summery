name: Hourly Radio Transcription

on:
  schedule:
    # Run at :20 past each target hour (IDT = UTC+3)
    # 06:20 IDT = 03:20 UTC
    - cron: "20 3 * * *"
    # 07:20 IDT = 04:20 UTC
    - cron: "20 4 * * *"
    # 08:20 IDT = 05:20 UTC
    - cron: "20 5 * * *"
    # 12:20 IDT = 09:20 UTC
    - cron: "20 9 * * *"
    # 13:20 IDT = 10:20 UTC
    - cron: "20 10 * * *"
    # 18:20 IDT = 15:20 UTC
    - cron: "20 15 * * *"
    # 19:20 IDT = 16:20 UTC
    - cron: "20 16 * * *"
    # 20:20 IDT = 17:20 UTC
    - cron: "20 17 * * *"
    # 21:20 IDT = 18:20 UTC
    - cron: "20 18 * * *"

  workflow_dispatch:   # allow manual trigger from GitHub Actions UI

jobs:
  transcribe-radio:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: news_summary/requirements.txt

      - name: Install dependencies
        run: pip install -r news_summary/requirements.txt

      - name: Transcribe bulletin and write to sheet
        env:
          GROQ_API_KEY:            ${{ secrets.GROQ_API_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          RADIO_SHEET_ID:          ${{ secrets.RADIO_SHEET_ID }}
        run: python news_summary/radio_to_sheet.py
